<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <radialGradient id="cuteBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1f2444" />
      <stop offset="70%" stop-color="#121528" />
      <stop offset="100%" stop-color="#080a14" />
    </radialGradient>
    <filter id="softGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ff1e56" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#cuteBg)" />

  <!-- Retro Cyber Grid -->
  <line x1="0" y1="100" x2="400" y2="100" stroke="#4facfe" stroke-opacity="0.1" stroke-width="2" />
  <line x1="0" y1="200" x2="400" y2="200" stroke="#4facfe" stroke-opacity="0.1" stroke-width="2" />
  <line x1="0" y1="300" x2="400" y2="300" stroke="#4facfe" stroke-opacity="0.1" stroke-width="2" />
  <line x1="100" y1="0" x2="100" y2="400" stroke="#ff1e56" stroke-opacity="0.1" stroke-width="2" />
  <line x1="200" y1="0" x2="200" y2="400" stroke="#ff1e56" stroke-opacity="0.1" stroke-width="2" />
  <line x1="300" y1="0" x2="300" y2="400" stroke="#ff1e56" stroke-opacity="0.1" stroke-width="2" />

  <!-- Cute Pixel Sparkles / Stars -->
  <rect x="70" y="80" width="8" height="8" fill="#ffd166" />
  <rect x="74" y="76" width="4" height="16" fill="#ffd166" />
  <rect x="320" y="90" width="8" height="8" fill="#ff758f" />
  <rect x="324" y="86" width="4" height="16" fill="#ff758f" />

  <!-- SUIT & BODY (Cute Navy Blue Executive Suit) -->
  <!-- Suit Shoulders -->
  <path d="M 50 400 L 100 280 L 145 250 L 255 250 L 300 280 L 350 400 Z" fill="#1b2446" stroke="#0e1329" stroke-width="4" />
  <!-- Suit Chest & Lapels -->
  <path d="M 110 280 L 155 360 L 140 400 L 70 400 Z" fill="#141c38" />
  <path d="M 290 280 L 245 360 L 260 400 L 330 400 Z" fill="#141c38" />

  <!-- White Crisp Shirt Collar -->
  <polygon points="175,245 225,245 200,320" fill="#ffffff" />
  <polygon points="150,240 180,265 170,240" fill="#f0f4ff" stroke="#cbd5e1" stroke-width="2" />
  <polygon points="250,240 220,265 230,240" fill="#f0f4ff" stroke="#cbd5e1" stroke-width="2" />

  <!-- Charming Crimson Tie -->
  <polygon points="192,250 208,250 212,266 188,266" fill="#a0082b" />
  <polygon points="188,266 212,266 218,365 200,385 182,365" fill="#e6194b" filter="url(#softGlow)" />
  <!-- Tie Highlight -->
  <polygon points="190,270 196,270 198,360 192,360" fill="#ff4d79" opacity="0.6" />

  <!-- Suit Lapels -->
  <polygon points="145,250 185,340 160,345 105,280" fill="#24305e" stroke="#0e1329" stroke-width="2" />
  <polygon points="255,250 215,340 240,345 295,280" fill="#24305e" stroke="#0e1329" stroke-width="2" />

  <!-- Gold Pocket Square / Pen -->
  <rect x="125" y="305" width="24" height="6" fill="#ffd166" />
  <polygon points="132,305 137,295 142,305" fill="#ffd166" />

  <!-- Gold Lapel Pin Badge -->
  <circle cx="260" cy="295" r="6" fill="#ffd166" stroke="#b08800" stroke-width="1.5" />
  <circle cx="260" cy="295" r="3" fill="#ffffff" />

  <!-- NECK -->
  <rect x="180" y="210" width="40" height="40" fill="#fcd5b5" />
  <polygon points="180,225 200,245 220,225 220,210 180,210" fill="#f0b68c" />

  <!-- CUTE FACE (Charming Anime/JRPG Boss) -->
  <path d="M 140 135 C 135 210, 160 235, 200 235 C 240 235, 265 210, 260 135 Z" fill="#fcd5b5" stroke="#4a3020" stroke-width="3" />

  <!-- Cute Ears -->
  <circle cx="138" cy="165" r="14" fill="#fcd5b5" stroke="#4a3020" stroke-width="2.5" />
  <circle cx="139" cy="165" r="7" fill="#f0b68c" />
  <circle cx="262" cy="165" r="14" fill="#fcd5b5" stroke="#4a3020" stroke-width="2.5" />
  <circle cx="261" cy="165" r="7" fill="#f0b68c" />

  <!-- Cute Blush Cheeks -->
  <ellipse cx="162" cy="182" rx="12" ry="7" fill="#ff758f" opacity="0.55" />
  <ellipse cx="238" cy="182" rx="12" ry="7" fill="#ff758f" opacity="0.55" />

  <!-- BIG CHARMING EYES (Anime Pixel Art Style) -->
  <!-- Left Eye -->
  <ellipse cx="172" cy="155" rx="14" ry="17" fill="#1b1e2e" />
  <ellipse cx="172" cy="157" rx="11" ry="14" fill="#2d3b66" />
  <!-- Highlights -->
  <circle cx="167" cy="148" r="5.5" fill="#ffffff" />
  <circle cx="177" cy="164" r="3" fill="#ffffff" />
  <!-- Eyelashes / Upper Lid -->
  <path d="M 154 148 Q 172 138 188 148" stroke="#10121d" stroke-width="4.5" fill="none" stroke-linecap="round" />

  <!-- Right Eye -->
  <ellipse cx="228" cy="155" rx="14" ry="17" fill="#1b1e2e" />
  <ellipse cx="228" cy="157" rx="11" ry="14" fill="#2d3b66" />
  <!-- Highlights -->
  <circle cx="223" cy="148" r="5.5" fill="#ffffff" />
  <circle cx="233" cy="164" r="3" fill="#ffffff" />
  <!-- Eyelashes / Upper Lid -->
  <path d="M 212 148 Q 228 138 246 148" stroke="#10121d" stroke-width="4.5" fill="none" stroke-linecap="round" />

  <!-- Eyebrows (Confident & Expressive) -->
  <path d="M 158 132 Q 174 124 186 130" stroke="#1b1e2e" stroke-width="3.5" fill="none" stroke-linecap="round" />
  <path d="M 214 130 Q 226 124 242 132" stroke="#1b1e2e" stroke-width="3.5" fill="none" stroke-linecap="round" />

  <!-- Small Cute Anime Nose -->
  <polygon points="198,168 202,168 200,172" fill="#d99b73" />

  <!-- Confident Charismatic Smirk -->
  <path d="M 188 190 Q 200 198 214 191" stroke="#8a3b14" stroke-width="3" fill="none" stroke-linecap="round" />
  <polygon points="196,192 208,192 202,197" fill="#ffffff" />

  <!-- CHARMING STYLED HAIR (Dark Navy / Black with Anime Bangs & Gloss) -->
  <path d="M 135 145 C 125 70, 160 45, 200 45 C 245 45, 275 70, 265 145 C 255 110, 240 100, 200 100 C 160 100, 145 110, 135 145 Z" fill="#202438" stroke="#0e101a" stroke-width="3" />
  <!-- Front Bangs -->
  <polygon points="135,130 155,145 160,115" fill="#282d46" />
  <polygon points="155,115 178,142 185,110" fill="#202438" />
  <polygon points="180,110 205,145 210,112" fill="#282d46" />
  <polygon points="205,112 230,140 238,115" fill="#202438" />
  <polygon points="230,115 255,140 262,125" fill="#282d46" />
  <!-- Hair Gloss Highlights -->
  <path d="M 160 68 Q 200 80 235 70" stroke="#5d6899" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8" />
  <path d="M 175 62 Q 200 70 220 64" stroke="#8fa0e6" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7" />

  <!-- HANDS (Charming Confident Pose / Thumb Up or Fist on Table) -->
  <g transform="translate(0, 5)">
    <!-- White Cuffs -->
    <rect x="145" y="360" width="30" height="12" fill="#ffffff" rx="3" />
    <rect x="225" y="360" width="30" height="12" fill="#ffffff" rx="3" />
    <!-- Gold Watch on Left Wrist -->
    <rect x="143" y="366" width="34" height="10" fill="#ffd166" rx="2" stroke="#b08800" stroke-width="1.5" />
    <circle cx="160" cy="371" r="4" fill="#ffffff" />
    <!-- Cute Folded Hands -->
    <ellipse cx="185" cy="380" rx="16" ry="14" fill="#fcd5b5" stroke="#4a3020" stroke-width="2" />
    <ellipse cx="215" cy="380" rx="16" ry="14" fill="#fcd5b5" stroke="#4a3020" stroke-width="2" />
    <ellipse cx="200" cy="385" rx="14" ry="12" fill="#f0b68c" stroke="#4a3020" stroke-width="1.5" />
  </g>

  <!-- Executive Boardroom Table Edge with Warm Wood Gradient -->
  <rect x="0" y="388" width="400" height="12" fill="#1b1424" />
  <line x1="0" y1="388" x2="400" y2="388" stroke="#ff1e56" stroke-width="2" />
</svg>
